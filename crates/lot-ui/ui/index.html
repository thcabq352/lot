<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lot</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="stage">
      <p id="notice" hidden></p>

      <section id="empty">
        <p class="kicker">Lot</p>
        <h1>Open a show.</h1>
        <p class="lede">Type a path. Same as <code>lot create</code> / <code>lot open</code>.</p>
        <form id="gate" autocomplete="off">
          <label>
            Path
            <input id="path" name="path" type="text" spellcheck="false" placeholder="path to the show" />
          </label>
          <label>
            Name
            <input id="name" name="name" type="text" spellcheck="false" placeholder="title" />
          </label>
          <div class="actions">
            <button type="submit" data-act="create">Create</button>
            <button type="button" data-act="open">Open</button>
          </div>
        </form>
      </section>

      <section id="bay" hidden>
        <p class="kicker">Lot</p>
        <h1 id="show-name"></h1>
        <p id="show-meta"></p>
        <ol id="rail"></ol>
        <p id="event" hidden></p>

        <section id="desk">
          <p id="brief-now"></p>
          <label class="field">
            Brief
            <textarea id="brief-text" rows="3" spellcheck="true" placeholder="what happens"></textarea>
          </label>
          <div class="actions">
            <button type="button" data-writer="brief">Confirm brief</button>
          </div>

          <p id="style-now" class="quiet"></p>
          <div class="row">
            <label class="field">
              Genre
              <input id="style-genre" type="text" spellcheck="false" placeholder="drama" />
            </label>
            <label class="field">
              Living
              <input id="style-living" type="text" spellcheck="false" placeholder="greta-gerwig" />
            </label>
            <label class="field">
              Canon
              <input id="style-canon" type="text" spellcheck="false" placeholder="akira-kurosawa" />
            </label>
            <label class="field">
              Format
              <select id="style-format">
                <option value="">—</option>
                <option value="feature">feature</option>
                <option value="30min">30min</option>
                <option value="15s">15s</option>
                <option value="episodic">episodic</option>
                <option value="advertisement">advertisement</option>
                <option value="music-video">music-video</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button type="button" data-writer="style">Confirm style</button>
          </div>

          <ul id="cast-now"></ul>
          <div class="row">
            <label class="field">
              Name
              <input id="cast-name" type="text" spellcheck="false" placeholder="Ada" />
            </label>
            <label class="field">
              Function
              <input id="cast-function" type="text" spellcheck="false" placeholder="lead" />
            </label>
            <label class="field">
              Look
              <input id="cast-look" type="text" spellcheck="false" />
            </label>
            <label class="field">
              Must not
              <input id="cast-must-not" type="text" spellcheck="false" />
            </label>
          </div>
          <div class="actions">
            <button type="button" data-writer="cast">Confirm cast</button>
          </div>

          <p id="draft-now" class="quiet"></p>
          <label class="field">
            Revise
            <textarea id="revise-notes" rows="2" spellcheck="true" placeholder="notes"></textarea>
          </label>
          <div class="actions">
            <button type="button" data-writer="draft">Draft</button>
            <button type="button" data-writer="revise">Revise</button>
            <button type="button" data-writer="lock">Lock</button>
            <button type="button" data-writer="unlock">Unlock</button>
          </div>
          <p id="theory" hidden></p>
        </section>
      </section>

      <aside id="school" data-on="false">
        <label class="dimmer">
          <span>School</span>
          <input id="school-on" type="checkbox" />
        </label>
        <div id="school-extra" hidden></div>
      </aside>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
