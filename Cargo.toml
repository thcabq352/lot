[workspace]
resolver = "2"
members = ["crates/lot-core", "crates/lot-cli", "crates/lot-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thcabq352/lot"
description = "Lot — agent-first film tools. Stdio first, GUI last."

[workspace.dependencies]
lot-core = { path = "crates/lot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
